# Cloudflare Worker — replaces the Express/Railway backend.
#   D1  : the database (was node:sqlite on a Railway volume)
#   KV  : uploaded images (was multer -> /data/uploads)
#   Assets: css / js / img served straight from Cloudflare's edge (free, cached)
# HTML is NOT an asset: the Worker imports it as text so it can substitute the
# __V__ cache-busting token and serve it no-cache. See worker/index.js.
name = "slv-visual"
main = "worker/index.js"
compatibility_date = "2026-08-01"

# Only reachable through the custom domain, so Cloudflare Access can't be
# side-stepped via a *.workers.dev URL.
workers_dev = true

[assets]
directory = "."
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "slv-visual"
database_id = "5b75f1f9-7c70-486e-b9a0-eacddfe3b6dd"

[[kv_namespaces]]
binding = "UPLOADS"
id = "4d69dc264815415a8297cb831084b715"

[vars]
# filled in once the Access application exists (see DEPLOY-CLOUDFLARE.md)
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""

# let the Worker import HTML and the SEO text files as strings
[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.txt", "**/*.xml", "**/*.webmanifest"]
fallthrough = true

# gives the Worker a unique id per deploy — used as the __V__ cache-bust token
[version_metadata]
binding = "CF_VERSION"
